[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kla-restoration"
version = "0.1.0"
description = "AI-based restoration of degraded semiconductor inspection images (KLA / i4C PS01)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scikit-image>=0.22",
    "lpips>=0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
